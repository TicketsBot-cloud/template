# Reusable CI pipeline: go build/vet/staticcheck/test, gofmt check, Docker build, Trivy scans.
# Call it from a per-repo workflow triggered on pull_request, e.g.:
#
#   name: CI
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#   jobs:
#     ci:
#       uses: TicketsBot-cloud/template/.github/workflows/ci.yaml@main
#       with:
#         package_name: worker
#         working_directory: .        # optional, default '.'
#         go_build_tags: jsoniter     # optional, default ''
#         skip_docker: false          # optional, default false - set true for repos with no Dockerfile
#       permissions:
#         contents: read
#         pull-requests: write

name: CI

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      working_directory:
        required: false
        type: string
        default: '.'
      go_build_tags:
        required: false
        type: string
        default: ''
      skip_docker:
        required: false
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.working_directory }}/go.mod
          cache-dependency-path: ${{ inputs.working_directory }}/go.sum

      - name: Go build
        id: build
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.go_build_tags }}" ]; then
            go build -tags="${{ inputs.go_build_tags }}" ./...
          else
            go build ./...
          fi

      - name: Go vet
        id: vet
        continue-on-error: true
        run: go vet ./...

      - name: Check gofmt
        id: fmt
        continue-on-error: true
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run staticcheck
        id: staticcheck
        continue-on-error: true
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Go test
        id: test
        continue-on-error: true
        run: go test ./... -count=1

      - name: Trivy dependency scan
        id: trivy-fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working_directory }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          output: ${{ github.workspace }}/trivy-fs-report.txt

      - name: Docker build
        id: docker-build
        if: ${{ !inputs.skip_docker }}
        continue-on-error: true
        run: docker build -f Dockerfile -t local/${{ inputs.package_name }}:ci .

      - name: Trivy image scan
        id: trivy-image
        if: ${{ !inputs.skip_docker && steps.docker-build.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local/${{ inputs.package_name }}:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          output: ${{ github.workspace }}/trivy-image-report.txt

      - name: Report results and gate
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const GATE_MARKER = '<!-- ci-gate -->';
            const skipDocker = ${{ inputs.skip_docker }};

            const CHECKS = [
              { id: 'build', label: 'go build' },
              { id: 'vet', label: 'go vet' },
              { id: 'fmt', label: 'gofmt' },
              { id: 'staticcheck', label: 'staticcheck' },
              { id: 'test', label: 'go test' },
              { id: 'trivy-fs', label: 'Trivy (dependencies)' },
              ...(skipDocker ? [] : [
                { id: 'docker-build', label: 'Docker build' },
                { id: 'trivy-image', label: 'Trivy (image)' },
              ]),
            ];

            const outcomes = {
              build: '${{ steps.build.outcome }}',
              vet: '${{ steps.vet.outcome }}',
              fmt: '${{ steps.fmt.outcome }}',
              staticcheck: '${{ steps.staticcheck.outcome }}',
              test: '${{ steps.test.outcome }}',
              'trivy-fs': '${{ steps.trivy-fs.outcome }}',
              'docker-build': '${{ steps.docker-build.outcome }}',
              'trivy-image': '${{ steps.trivy-image.outcome }}',
            };

            const ICONS = { success: '✅', failure: '❌', skipped: '⏭️', cancelled: '⏭️' };
            const failed = CHECKS.filter(c => outcomes[c.id] === 'failure');

            const rows = CHECKS
              .map(c => `| ${c.label} | ${ICONS[outcomes[c.id]] || outcomes[c.id]} |`)
              .join('\n');

            function readReport(path) {
              try {
                const content = fs.readFileSync(path, 'utf8').trim();
                if (!content) return null;
                const MAX = 5000;
                return content.length > MAX ? content.slice(0, MAX) + '\n... (truncated, see full run log)' : content;
              } catch {
                return null;
              }
            }

            const trivyFsReport = readReport(`${process.env.GITHUB_WORKSPACE}/trivy-fs-report.txt`);
            const trivyImageReport = readReport(`${process.env.GITHUB_WORKSPACE}/trivy-image-report.txt`);

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            let body = `${GATE_MARKER}\n### CI ${failed.length > 0 ? 'failed' : 'passed'}\n\n| Check | Result |\n| --- | --- |\n${rows}\n\n[Full run log](${runUrl})`;

            if (trivyFsReport) {
              body += `\n\n<details><summary>Trivy dependency scan findings (CRITICAL/HIGH)</summary>\n\n\`\`\`\n${trivyFsReport}\n\`\`\`\n</details>`;
            }
            if (trivyImageReport) {
              body += `\n\n<details><summary>Trivy image scan findings (CRITICAL/HIGH)</summary>\n\n\`\`\`\n${trivyImageReport}\n\`\`\`\n</details>`;
            }

            if (pr) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
              });
              const existingComment = comments.find(c => c.body && c.body.includes(GATE_MARKER));

              if (existingComment) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existingComment.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              }
            } else {
              core.info('Not a pull_request event, skipping comment');
              core.info(body);
            }

            if (failed.length > 0) {
              core.setFailed(`CI failed: ${failed.map(c => c.label).join(', ')}`);
            }
